<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/app-favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ORBILINK</title>
    <meta name="description" content="Production real-time messenger featuring real Firebase authentication, Firestore synchronization, voice notes, media sharing, Google integrations, and server-side AI assistant." />
    <meta property="og:title" content="ORBILINK" />
    <meta property="og:description" content="Production real-time messenger featuring real Firebase authentication, Firestore synchronization, voice notes, media sharing, Google integrations, and server-side AI assistant." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var isBenignNotice = function(str) {
          if (!str || typeof str !== 'string') return false;
          var s = str.toLowerCase();
          return (
            s.includes('[vite]') ||
            s.includes('failed to connect to websocket') ||
            s.includes('websocket closed without opened') ||
            s.includes('client is offline') ||
            s.includes('failed to get document because the client is offline')
          );
        };

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) {
            return (a && (a.message || a.stack)) || String(a || '');
          }).join(' ');
          if (isBenignNotice(str)) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) {
            return (a && (a.message || a.stack)) || String(a || '');
          }).join(' ');
          if (isBenignNotice(str)) {
            return;
          }
          return origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (isBenignNotice(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (isBenignNotice(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          function SafeWebSocket(url, protocols) {
            var isVite = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) {
              isVite = true;
            } else if (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; })) {
              isVite = true;
            } else if (typeof url === 'string' && url.indexOf('vite') !== -1) {
              isVite = true;
            }

            if (isVite) {
              var listeners = {};
              var socket = {
                url: url,
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                },
                removeEventListener: function(type, listener) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                },
                dispatchEvent: function(event) {
                  var list = listeners[event.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i].call(socket, event); } catch(e) {}
                  }
                  return true;
                },
                send: function() {},
                close: function() {
                  socket.readyState = 3;
                }
              };
              setTimeout(function() {
                var ev = { type: 'open', target: socket };
                if (typeof socket.onopen === 'function') {
                  try { socket.onopen(ev); } catch(e) {}
                }
                socket.dispatchEvent(ev);
              }, 10);
              return socket;
            }

            return new NativeWS(url, protocols);
          }

          SafeWebSocket.prototype = NativeWS.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;

          window.WebSocket = SafeWebSocket;
        }
      })();
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased font-sans selection:bg-[#25D366]/30 selection:text-[#25D366]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
